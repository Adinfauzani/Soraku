version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./apps/api/.env
    environment:
      - NODE_ENV=production
      # Sidecar scrapers live inside the same compose network — use service names, not localhost.
      - WAJIK_API_URL=http://wajik-api:3001
      - MIRURO_API_URL=http://miruro-api:3002
    depends_on:
      wajik-api:
        condition: service_healthy
      miruro-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--eval", "require('http').get('http://localhost:4000/', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  wajik-api:
    build:
      context: ../wajik-anime-api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "--eval", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  miruro-api:
    build:
      context: ../miruro-api
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:3002/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
</content>
